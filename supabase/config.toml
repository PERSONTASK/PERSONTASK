# PERSONTASK — configuração do Supabase local (opcional: `supabase start`)
project_id = "persontask"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]

[db]
port = 54322

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false   # em produção, habilite a confirmação de e-mail

# Login social com Google (preencha os segredos via variáveis de ambiente).
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"

[functions.notify-item-assigned]
verify_jwt = false

[functions.notify-mention]
verify_jwt = false

[functions.notify-due-soon]
verify_jwt = false

[functions.send-invite]
verify_jwt = false
